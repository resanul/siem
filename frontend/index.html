<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSOC Forge — Security Operations & Management Platform</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#00ff41',
              dark: '#080c14',
              surface: '#0e1422',
              card: '#131b2e',
              border: '#1f293d',
              accent: '#38bdf8'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #080c14; color: #f1f5f9; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0e1422; }
    ::-webkit-scrollbar-thumb { background: #26334d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b4d71; }
    .neon-glow { text-shadow: 0 0 10px rgba(0, 255, 65, 0.4); }
  </style>
</head>
<body class="font-sans antialiased text-slate-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Default mock data aligned with backend API
    const initialOverview = {
      status: "OPERATIONAL",
      release: "v1.0.0-lab",
      profile: "Single-Node Lab",
      eps: 534.6,
      latency: 14.8,
      totalAlerts: 5,
      criticalAlerts: 1,
      highAlerts: 2,
      activeCases: 1,
      totalEndpoints: 12,
      healthyEndpoints: 11,
      mitreCoverage: 28,
    };

    const initialAlerts = [
      { id: "ALT-2026-001", time: "20:12:45Z", severity: "CRITICAL", source: "suricata", title: "ET EXPLOIT Possible Log4j RCE Attempt (CVE-2021-44228)", host: "web-app-dmz-01", src_ip: "10.0.1.15", dest_ip: "198.51.100.84", mitre: "T1190", status: "NEW" },
      { id: "ALT-2026-002", time: "20:18:10Z", severity: "HIGH", source: "wazuh", title: "Wazuh FIM: Unauthorized Binary Modification in /usr/bin", host: "db-cluster-node-02", src_ip: "10.0.2.22", dest_ip: "-", mitre: "T1548.003", status: "INVESTIGATING" },
      { id: "ALT-2026-003", time: "20:25:01Z", severity: "HIGH", source: "suricata", title: "ET MALWARE Cobalt Strike Beacon Malleable C2 Traffic", host: "workstation-corp-88", src_ip: "10.0.10.88", dest_ip: "203.0.113.42", mitre: "T1071.001", status: "NEW" },
      { id: "ALT-2026-004", time: "20:30:19Z", severity: "MEDIUM", source: "wazuh", title: "Wazuh SCA: CIS Benchmark Audit Failure on SSH Root Login", host: "bastion-gw-01", src_ip: "10.0.0.1", dest_ip: "-", mitre: "T1078.001", status: "ACKNOWLEDGED" },
      { id: "ALT-2026-005", time: "20:34:55Z", severity: "LOW", source: "syslog", title: "Network Core Switch: Repeated Invalid Authentication Attempts", host: "core-switch-01", src_ip: "10.0.0.254", dest_ip: "-", mitre: "T1110.001", status: "NEW" },
    ];

    const initialComponents = [
      { name: "elasticsearch", version: "7.17.13", status: "HEALTHY", ports: "9200, 9300", type: "Native Package", pid: 3102, uptime: "4d 18h" },
      { name: "kibana", version: "7.17.13", status: "HEALTHY", ports: "5601", type: "Native Package", pid: 3150, uptime: "4d 18h" },
      { name: "filebeat", version: "7.17.13", status: "HEALTHY", ports: "-", type: "Native Package", pid: 3188, uptime: "4d 18h" },
      { name: "wazuh_manager", version: "4.5.4", status: "HEALTHY", ports: "1514, 1515, 55000", type: "Native Package", pid: 1042, uptime: "4d 18h" },
      { name: "suricata", version: "7.0.5", status: "HEALTHY", ports: "AF_PACKET (eth0)", type: "Native Package", pid: 2105, uptime: "4d 18h" },
      { name: "syslog", version: "1.0.0", status: "HEALTHY", ports: "514, 6514 TLS", type: "Builtin Ingestion", pid: 4018, uptime: "4d 18h" },
    ];

    const initialJobs = [
      { id: "job-1001", op: "INSTALL", release: "v1.0.0-lab", status: "SUCCESS", duration: "42s", user: "admin", time: "2026-10-14 18:30" },
      { id: "job-1002", op: "UPGRADE", release: "v1.1.0-candidate", status: "ROLLED_BACK", duration: "18s", user: "admin", time: "2026-10-14 19:15", error: "Simulated syntax failure during atomic configuration staging" },
    ];

    function App() {
      const [currentScreen, setCurrentScreen] = useState("overview");
      const [userRole, setUserRole] = useState("Platform Admin");
      const [alerts, setAlerts] = useState(initialAlerts);
      const [jobs, setJobs] = useState(initialJobs);
      const [selectedAlert, setSelectedAlert] = useState(null);
      const [syntheticStatus, setSyntheticStatus] = useState(null);
      const [filterSeverity, setFilterSeverity] = useState("ALL");
      const [filterSource, setFilterSource] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      const [testLogSample, setTestLogSample] = useState("Oct 14 20:12:45 web-app-dmz-01 java: Outbound ldap://198.51.100.84:1389/Exploit");
      const [testRuleSyntaxResult, setTestRuleSyntaxResult] = useState(null);
      const [restoreModalOpen, setRestoreModalOpen] = useState(false);
      const [restoreToken, setRestoreToken] = useState("");
      const [restoreMessage, setRestoreMessage] = useState("");

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentScreen, selectedAlert, syntheticStatus, testRuleSyntaxResult]);

      const triggerSyntheticTest = (comp = "suricata") => {
        setSyntheticStatus({ loading: true, comp });
        setTimeout(() => {
          setSyntheticStatus({
            loading: false,
            passed: true,
            id: `synth-${comp}-${Date.now().toString().slice(-6)}`,
            comp,
            latency: 34.2,
          });
        }, 800);
      };

      const executeTestRule = () => {
        setTestRuleSyntaxResult({
          valid: true,
          matches: testLogSample.includes("198.51.100.84") || testLogSample.includes("Exploit"),
          extractedFields: { dest_ip: "198.51.100.84", protocol: "ldap", severity: "CRITICAL" },
        });
      };

      const handleRestore = () => {
        if (restoreToken === "CONFIRM_RESTORE") {
          setRestoreMessage("Success: State restored from snapshot and verified.");
          setTimeout(() => {
            setRestoreModalOpen(false);
            setRestoreToken("");
            setRestoreMessage("");
          }, 1500);
        } else {
          setRestoreMessage("Error: Token must be 'CONFIRM_RESTORE'");
        }
      };

      const filteredAlerts = alerts.filter(a => {
        if (filterSeverity !== "ALL" && a.severity !== filterSeverity) return false;
        if (filterSource !== "ALL" && a.source !== filterSource) return false;
        if (searchQuery && !a.title.toLowerCase().includes(searchQuery.toLowerCase()) && !a.host.toLowerCase().includes(searchQuery.toLowerCase())) return false;
        return true;
      });

      const navSections = [
        {
          title: "OPERATIONS",
          items: [
            { id: "overview", label: "Overview Dashboard", icon: "layout-dashboard" },
            { id: "alerts", label: "Alerts & Detections", icon: "shield-alert", badge: alerts.length },
            { id: "search", label: "Event Investigation", icon: "search" },
            { id: "hosts", label: "Hosts & Agents", icon: "server" },
            { id: "network", label: "Network Telemetry", icon: "network" },
            { id: "cases", label: "Cases & Incident Triage", icon: "folder-kanban", badge: 1 },
          ]
        },
        {
          title: "DETECTIONS & COMPLIANCE",
          items: [
            { id: "rules", label: "Rules & Integrations", icon: "code" },
            { id: "reports", label: "Reports & Compliance", icon: "file-bar-chart" },
          ]
        },
        {
          title: "MANAGEMENT & LIFECYCLE",
          items: [
            { id: "inventory", label: "Component Inventory", icon: "cpu" },
            { id: "jobs", label: "Deployment Jobs", icon: "git-commit" },
            { id: "health", label: "Health & Diagnostics", icon: "activity" },
            { id: "releases", label: "Release & Compatibility", icon: "layers" },
            { id: "backup", label: "Backup & Recovery", icon: "database" },
          ]
        },
        {
          title: "ADMINISTRATION",
          items: [
            { id: "audit", label: "Users & Audit Trail", icon: "file-lock-2" },
            { id: "settings", label: "Platform Settings", icon: "settings" },
          ]
        }
      ];

      return (
        <div className="flex h-screen overflow-hidden bg-[#080c14]">
          {/* SIDEBAR NAVIGATION */}
          <aside className="w-64 bg-[#0e1422] border-r border-[#1f293d] flex flex-col justify-between shrink-0">
            <div>
              <div className="p-4 border-b border-[#1f293d] flex items-center justify-between">
                <div className="flex items-center space-x-2">
                  <div className="w-8 h-8 rounded bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold font-mono">
                    OS
                  </div>
                  <div>
                    <h1 className="font-bold text-sm tracking-wider text-slate-100">OpenSOC Forge</h1>
                    <span className="text-[10px] text-emerald-400 font-mono">v1.0.0-lab [STABLE]</span>
                  </div>
                </div>
              </div>

              {/* DEMO DATA INDICATOR */}
              <div className="px-4 py-1.5 bg-amber-500/10 border-b border-amber-500/20 text-amber-400 text-[10px] font-mono flex items-center justify-between">
                <span>DEV / LAB ENVIRONMENT</span>
                <span className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
              </div>

              {/* NAV MENU */}
              <nav className="p-3 space-y-5 overflow-y-auto max-h-[calc(100vh-140px)]">
                {navSections.map((sec, idx) => (
                  <div key={idx}>
                    <p className="px-3 text-[10px] font-bold text-slate-400 tracking-wider mb-1.5 uppercase font-mono">{sec.title}</p>
                    <div className="space-y-0.5">
                      {sec.items.map(item => {
                        const active = currentScreen === item.id;
                        return (
                          <button
                            key={item.id}
                            onClick={() => { setCurrentScreen(item.id); setSelectedAlert(null); }}
                            className={`w-full flex items-center justify-between px-3 py-2 rounded text-xs transition-all ${
                              active
                                ? "bg-emerald-500/10 text-emerald-400 font-medium border-l-2 border-emerald-400"
                                : "text-slate-400 hover:text-slate-200 hover:bg-[#131b2e]"
                            }`}
                          >
                            <span className="flex items-center space-x-2.5">
                              <i data-lucide={item.icon} className="w-4 h-4"></i>
                              <span>{item.label}</span>
                            </span>
                            {item.badge !== undefined && (
                              <span className="px-1.5 py-0.5 text-[9px] font-bold rounded-full bg-[#1e293b] text-slate-300">
                                {item.badge}
                              </span>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </nav>
            </div>

            {/* USER / RBAC SWITCHER FOOTER */}
            <div className="p-3 border-t border-[#1f293d] bg-[#0b101c]">
              <div className="flex items-center justify-between mb-1.5">
                <span className="text-[10px] text-slate-400 uppercase font-mono">Simulated Role:</span>
                <span className="text-[10px] text-emerald-400 font-mono font-bold">{userRole}</span>
              </div>
              <select
                value={userRole}
                onChange={e => setUserRole(e.target.value)}
                className="w-full bg-[#131b2e] border border-[#1f293d] rounded text-xs px-2 py-1 text-slate-200 focus:outline-none focus:border-emerald-500"
              >
                <option value="Platform Admin">Platform Admin (Full)</option>
                <option value="Incident Responder">Incident Responder</option>
                <option value="Detection Engineer">Detection Engineer</option>
                <option value="Recovery Operator">Recovery Operator</option>
                <option value="SecOps Viewer">SecOps Viewer (Read Only)</option>
              </select>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden">
            {/* TOP BAR */}
            <header className="h-14 bg-[#0e1422] border-b border-[#1f293d] px-6 flex items-center justify-between shrink-0">
              <div className="flex items-center space-x-3">
                <span className="text-slate-400 text-xs uppercase font-mono tracking-wider">Workspace:</span>
                <span className="text-xs font-semibold text-slate-200 bg-[#131b2e] px-2.5 py-1 rounded border border-[#1f293d]">
                  OpenSOC Forge Production Lab (12 Endpoints)
                </span>
                <span className="flex items-center space-x-1.5 px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] font-mono">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>PIPELINE HEALTHY (14.8ms)</span>
                </span>
              </div>

              <div className="flex items-center space-x-3">
                {/* Synthetic Event Injector Button */}
                <button
                  onClick={() => triggerSyntheticTest("suricata")}
                  disabled={syntheticStatus?.loading || userRole === "SecOps Viewer"}
                  className="px-3 py-1.5 rounded bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-mono flex items-center space-x-1.5 disabled:opacity-50"
                  title="Inject harmless test alert to verify end-to-end telemetry pipeline"
                >
                  <i data-lucide="zap" className="w-3.5 h-3.5"></i>
                  <span>{syntheticStatus?.loading ? "Verifying..." : "Inject Synthetic Event"}</span>
                </button>

                <div className="h-4 w-px bg-[#1f293d]"></div>

                <div className="flex items-center space-x-2 text-xs">
                  <div className="w-6 h-6 rounded-full bg-slate-700 flex items-center justify-center font-bold text-slate-300">
                    A
                  </div>
                  <span className="text-slate-300 font-medium">admin</span>
                </div>
              </div>
            </header>

            {/* SYNTHETIC EVENT TOAST NOTIFICATION */}
            {syntheticStatus && (
              <div className={`mx-6 mt-3 p-3 rounded border text-xs font-mono flex items-center justify-between ${
                syntheticStatus.passed ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-400" : "bg-amber-500/10 border-amber-500/30 text-amber-400"
              }`}>
                <div className="flex items-center space-x-2">
                  <i data-lucide={syntheticStatus.passed ? "check-circle" : "loader"} className="w-4 h-4"></i>
                  <span>
                    Pipeline Verification: Injected event <strong>{syntheticStatus.id}</strong> through {syntheticStatus.comp} (Ingestion & search validated in {syntheticStatus.latency}ms)
                  </span>
                </div>
                <button onClick={() => setSyntheticStatus(null)} className="text-slate-400 hover:text-slate-200">✕</button>
              </div>
            )}

            {/* SCREEN RENDERER */}
            <div className="flex-1 overflow-y-auto p-6 space-y-6">

              {/* 1. OVERVIEW DASHBOARD */}
              {currentScreen === "overview" && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-xl font-bold text-slate-100">Security Operations Center Overview</h2>
                      <p className="text-xs text-slate-400">Continuous telemetry monitoring across HIDS, NIDS, and Syslog log streams.</p>
                    </div>
                    <div className="text-right text-xs font-mono text-slate-400">
                      <div>Active Release: <span className="text-emerald-400 font-semibold">{initialOverview.release}</span></div>
                      <div>Architecture: <span className="text-slate-200">{initialOverview.profile}</span></div>
                    </div>
                  </div>

                  {/* KEY METRICS GRID */}
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-[#0e1422] p-4 rounded-lg border border-[#1f293d]">
                      <div className="flex justify-between items-start text-slate-400 text-xs mb-1">
                        <span>CRITICAL & HIGH ALERTS</span>
                        <i data-lucide="shield-alert" className="w-4 h-4 text-rose-500"></i>
                      </div>
                      <div className="text-2xl font-bold text-rose-500 font-mono">
                        {initialOverview.criticalAlerts + initialOverview.highAlerts}
                      </div>
                      <p className="text-[11px] text-slate-400 mt-1">1 Critical Log4j, 2 High C2 beacons</p>
                    </div>

                    <div className="bg-[#0e1422] p-4 rounded-lg border border-[#1f293d]">
                      <div className="flex justify-between items-start text-slate-400 text-xs mb-1">
                        <span>EVENTS PER SECOND</span>
                        <i data-lucide="activity" className="w-4 h-4 text-emerald-400"></i>
                      </div>
                      <div className="text-2xl font-bold text-emerald-400 font-mono">
                        {initialOverview.eps} <span className="text-xs text-slate-400 font-normal">EPS</span>
                      </div>
                      <p className="text-[11px] text-slate-400 mt-1">Pipeline ingestion latency: 14.8 ms</p>
                    </div>

                    <div className="bg-[#0e1422] p-4 rounded-lg border border-[#1f293d]">
                      <div className="flex justify-between items-start text-slate-400 text-xs mb-1">
                        <span>MONITORED ENDPOINTS</span>
                        <i data-lucide="server" className="w-4 h-4 text-sky-400"></i>
                      </div>
                      <div className="text-2xl font-bold text-sky-400 font-mono">
                        {initialOverview.healthyEndpoints} / {initialOverview.totalEndpoints}
                      </div>
                      <p className="text-[11px] text-slate-400 mt-1">11 Linux, 1 Windows Server agent</p>
                    </div>

                    <div className="bg-[#0e1422] p-4 rounded-lg border border-[#1f293d]">
                      <div className="flex justify-between items-start text-slate-400 text-xs mb-1">
                        <span>MITRE ATT&CK TECHNIQUES</span>
                        <i data-lucide="crosshair" className="w-4 h-4 text-purple-400"></i>
                      </div>
                      <div className="text-2xl font-bold text-purple-400 font-mono">
                        {initialOverview.mitreCoverage} <span className="text-xs text-slate-400 font-normal">Rules</span>
                      </div>
                      <p className="text-[11px] text-slate-400 mt-1">Active Sigma & Wazuh detections</p>
                    </div>
                  </div>

                  {/* COMPONENT HEALTH STRIP */}
                  <div className="bg-[#0e1422] p-4 rounded-lg border border-[#1f293d]">
                    <h3 className="text-xs font-mono font-bold text-slate-400 uppercase tracking-wider mb-3">Management & Telemetry Plane Components</h3>
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
                      {initialComponents.map((c, i) => (
                        <div key={i} className="p-3 rounded bg-[#131b2e] border border-[#1f293d]">
                          <div className="flex items-center justify-between text-xs mb-1">
                            <span className="font-semibold text-slate-200">{c.name}</span>
                            <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                          </div>
                          <div className="text-[11px] text-slate-400 font-mono">{c.version}</div>
                          <div className="text-[10px] text-emerald-400/90 font-mono mt-1">{c.ports}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* RECENT ALERTS PREVIEW */}
                  <div className="bg-[#0e1422] rounded-lg border border-[#1f293d] overflow-hidden">
                    <div className="px-5 py-3 border-b border-[#1f293d] flex justify-between items-center">
                      <h3 className="text-sm font-semibold text-slate-100">Live Telemetry Alert Queue</h3>
                      <button onClick={() => setCurrentScreen("alerts")} className="text-xs text-emerald-400 hover:underline">View All Alerts →</button>
                    </div>
                    <div className="divide-y divide-[#1f293d]">
                      {alerts.slice(0, 3).map((a, i) => (
                        <div key={i} className="p-4 hover:bg-[#131b2e] transition flex items-center justify-between text-xs">
                          <div className="flex items-center space-x-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              a.severity === "CRITICAL" ? "bg-rose-500/10 text-rose-400 border border-rose-500/30" : "bg-amber-500/10 text-amber-400 border border-amber-500/30"
                            }`}>{a.severity}</span>
                            <div>
                              <div className="font-semibold text-slate-200">{a.title}</div>
                              <div className="text-slate-400 text-[11px] font-mono">Host: {a.host} • Source: {a.source} • MITRE: {a.mitre}</div>
                            </div>
                          </div>
                          <span className="text-slate-400 font-mono text-[11px]">{a.time}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* 2. ALERTS & DETECTIONS */}
              {currentScreen === "alerts" && (
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-xl font-bold text-slate-100">Alerts & Detection Queue</h2>
                      <p className="text-xs text-slate-400">Normalized alerts with MITRE ATT&CK alignment, raw telemetry pivot, and triage.</p>
                    </div>
                    <div className="flex space-x-2">
                      <select value={filterSeverity} onChange={e => setFilterSeverity(e.target.value)} className="bg-[#131b2e] border border-[#1f293d] text-xs px-2.5 py-1.5 rounded text-slate-200">
                        <option value="ALL">All Severities</option>
                        <option value="CRITICAL">Critical Only</option>
                        <option value="HIGH">High Only</option>
                        <option value="MEDIUM">Medium Only</option>
                      </select>
                      <select value={filterSource} onChange={e => setFilterSource(e.target.value)} className="bg-[#131b2e] border border-[#1f293d] text-xs px-2.5 py-1.5 rounded text-slate-200">
                        <option value="ALL">All Sources</option>
                        <option value="suricata">Suricata NIDS</option>
                        <option value="wazuh">Wazuh HIDS</option>
                        <option value="syslog">Syslog</option>
                      </select>
                    </div>
                  </div>

                  <div className="bg-[#0e1422] rounded-lg border border-[#1f293d] overflow-hidden">
                    <div className="p-3 border-b border-[#1f293d]">
                      <input
                        type="text"
                        placeholder="Search alerts by host, title, or IP..."
                        value={searchQuery}
                        onChange={e => setSearchQuery(e.target.value)}
                        className="w-full bg-[#131b2e] border border-[#1f293d] text-xs px-3 py-2 rounded text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                      <p className="text-xs text-slate-400">Idempotent execution history, preflight reports, and failure recovery states.</p>
                    </div>
                  </div>

                  <div className="bg-[#0e1422] rounded-lg border border-[#1f293d] overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-[#131b2e] text-slate-400 font-mono text-[11px] border-b border-[#1f293d]">
                        <tr>
                          <th className="p-3">JOB ID</th>
                          <th className="p-3">OPERATION</th>
                          <th className="p-3">TARGET RELEASE</th>
                          <th className="p-3">STATUS</th>
                          <th className="p-3">DURATION</th>
                          <th className="p-3">OPERATOR</th>
                          <th className="p-3">TIMESTAMP</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1f293d]">
                        {jobs.map(j => (
                          <tr key={j.id} className="hover:bg-[#131b2e]/60">
                            <td className="p-3 font-mono text-slate-400">{j.id}</td>
                            <td className="p-3 font-mono text-slate-200">{j.op}</td>
                            <td className="p-3 font-mono text-emerald-400">{j.release}</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-mono ${
                                j.status === "SUCCESS" ? "bg-emerald-500/10 text-emerald-400" : "bg-purple-500/10 text-purple-400 border border-purple-500/30"
                              }`}>{j.status}</span>
                            </td>
                            <td className="p-3 font-mono text-slate-400">{j.duration}</td>
                            <td className="p-3 font-mono text-slate-300">{j.user}</td>
                            <td className="p-3 font-mono text-slate-400">{j.time}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="bg-[#0e1422] p-4 rounded-lg border border-[#1f293d] text-xs">
                    <div className="font-semibold text-slate-200 mb-1">Recovery Note on job-1002:</div>
                    <div className="text-slate-400 font-mono">
                      Controlled failure simulation: Target candidate configuration syntax failed schema check.
                      Engine preserved prior working configuration, verified pipeline integrity, and restored baseline release.
                    </div>
                  </div>
                </div>
              )}

              {/* 11. HEALTH & DIAGNOSTICS */}
              {currentScreen === "health" && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-bold text-slate-100">Health Monitoring & Diagnostics</h2>
                      <p className="text-xs text-slate-400">Multi-level health evaluation (Process, API, Pipeline, Storage pressure).</p>
                    </div>
                    <button className="px-3 py-1.5 bg-[#1f293d] hover:bg-slate-700 text-slate-200 text-xs rounded font-mono">
                      Export Redacted Diagnostic Bundle (.tar.gz)
                    </button>
                  </div>

                  <div className="grid grid-cols-2 gap-4 text-xs">
                    <div className="p-4 bg-[#0e1422] rounded-lg border border-[#1f293d] space-y-2">
                      <div className="font-semibold text-slate-200 font-mono uppercase text-xs">Host Resource Pressure</div>
                      <div className="space-y-1 text-slate-400">
                        <div className="flex justify-between">
                          <span>RAM Allocation (8192 MB Total)</span>
                          <span className="font-mono text-slate-200">54% Used (4424 MB)</span>
                        </div>
                        <div className="flex justify-between">
                          <span>Disk Storage (/var/lib)</span>
                          <span className="font-mono text-slate-200">34.2 GB Free of 60 GB</span>
                        </div>
                        <div className="flex justify-between">
                          <span>CPU Load Average</span>
                          <span className="font-mono text-slate-200">0.42, 0.55, 0.61</span>
                        </div>
                      </div>
                    </div>

                    <div className="p-4 bg-[#0e1422] rounded-lg border border-[#1f293d] space-y-2">
                      <div className="font-semibold text-slate-200 font-mono uppercase text-xs">Secret Redaction Safeguards</div>
                      <p className="text-slate-400">
                        Diagnostic bundles automatically mask API tokens, Wazuh registration passwords, and TLS private keys.
                      </p>
                      <div className="p-2 rounded bg-[#080c14] border border-[#1f293d] font-mono text-[11px] text-emerald-400">
                        Diagnostics Redactor: 6 credential fields masked in latest snapshot.
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* 12. RELEASE & COMPATIBILITY REGISTRY */}
              {currentScreen === "releases" && (
                <div className="space-y-4">
                  <h2 className="text-xl font-bold text-slate-100">Release & Compatibility Registry</h2>
                  <p className="text-xs text-slate-400">Version-controlled manifests, immutable checksums, and dependency matrix solver.</p>

                  <div className="grid grid-cols-2 gap-4">
                    <div className="p-5 bg-[#0e1422] rounded-lg border-2 border-emerald-500/40 space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">CURRENT ACTIVE RELEASE</span>
                          <h3 className="text-base font-bold text-slate-100 mt-1">v1.0.0-lab [Stable Channel]</h3>
                        </div>
                        <span className="text-xs font-mono text-emerald-400 font-bold">COMPATIBLE (100%)</span>
                      </div>
                      <div className="space-y-1 text-xs text-slate-400 font-mono">
                        <div>Elasticsearch & Kibana: 7.17.13</div>
                        <div>Wazuh Manager & Agents: 4.5.4</div>
                        <div>Suricata Engine: 7.0.5</div>
                        <div>Syslog RFC 5424 Collector: 1.0.0</div>
                      </div>
                      <div className="p-2.5 rounded bg-[#131b2e] text-[11px] font-mono text-slate-300">
                        Provenance Checksum: sha256:7f83b165... Verified
                      </div>
                    </div>

                    <div className="p-5 bg-[#0e1422] rounded-lg border border-[#1f293d] space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-purple-500/10 text-purple-400 border border-purple-500/30">CANDIDATE CHANNEL</span>
                          <h3 className="text-base font-bold text-slate-100 mt-1">v1.1.0-candidate</h3>
                        </div>
                        <span className="text-xs font-mono text-sky-400 font-bold">UPGRADE PATH VERIFIED</span>
                      </div>
                      <div className="space-y-1 text-xs text-slate-400 font-mono">
                        <div>Elasticsearch & Kibana: 7.17.24</div>
                        <div>Wazuh Manager & Agents: 4.8.2</div>
                        <div>Suricata Engine: 7.0.6</div>
                        <div>Syslog Collector: 1.1.0</div>
                      </div>
                      <div className="p-2.5 rounded bg-[#131b2e] text-[11px] font-mono text-amber-400">
                        Notice: Requires staged pre-upgrade verification before production rollout.
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* 13. BACKUP & RECOVERY */}
              {currentScreen === "backup" && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-bold text-slate-100">Backup, Restore & Disaster Recovery</h2>
                      <p className="text-xs text-slate-400">Checksummed state archives, recovery-point verification, and non-destructive rollbacks.</p>
                    </div>
                    <button
                      onClick={() => setRestoreModalOpen(true)}
                      disabled={userRole === "SecOps Viewer"}
                      className="px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs rounded font-mono disabled:opacity-50"
                    >
                      Restore From Verified Checkpoint
                    </button>
                  </div>

                  <div className="bg-[#0e1422] rounded-lg border border-[#1f293d] overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-[#131b2e] text-slate-400 font-mono text-[11px] border-b border-[#1f293d]">
                        <tr>
                          <th className="p-3">CHECKPOINT ID</th>
                          <th className="p-3">COMPONENT</th>
                          <th className="p-3">ARCHIVE CHECKSUM (SHA-256)</th>
                          <th className="p-3">SIZE</th>
                          <th className="p-3">INTEGRITY</th>
                          <th className="p-3">CREATED</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1f293d]">
                        {[
                          { id: "es-backup-1791989", comp: "elasticsearch", sha: "sha256:4a12f9...b78", size: "48 KB", verified: true, time: "2026-10-14 18:30" },
                          { id: "wazuh-backup-1791989", comp: "wazuh_manager", sha: "sha256:91b2c4...e10", size: "12 KB", verified: true, time: "2026-10-14 18:30" },
                          { id: "suri-backup-1791989", comp: "suricata", sha: "sha256:fe881a...009", size: "8 KB", verified: true, time: "2026-10-14 18:30" },
                        ].map((b, i) => (
                          <tr key={i} className="hover:bg-[#131b2e]/60 font-mono text-[11px]">
                            <td className="p-3 text-slate-300 font-semibold">{b.id}</td>
                            <td className="p-3 text-slate-400">{b.comp}</td>
                            <td className="p-3 text-emerald-400">{b.sha}</td>
                            <td className="p-3 text-slate-400">{b.size}</td>
                            <td className="p-3 text-emerald-400">PASSED</td>
                            <td className="p-3 text-slate-400">{b.time}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* RESTORE MODAL */}
                  {restoreModalOpen && (
                    <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
                      <div className="bg-[#0e1422] border border-[#1f293d] rounded-lg max-w-md w-full p-5 space-y-4">
                        <div className="flex justify-between items-start">
                          <h3 className="font-bold text-slate-100 text-sm">Confirm Destructive State Restore</h3>
                          <button onClick={() => setRestoreModalOpen(false)} className="text-slate-400 hover:text-slate-200">✕</button>
                        </div>
                        <p className="text-xs text-slate-400">
                          Restoring will overwrite current running configuration and roll back state to verified checkpoint.
                          To prevent accidental data loss, please type: <code>CONFIRM_RESTORE</code>
                        </p>
                        <input
                          type="text"
                          value={restoreToken}
                          onChange={e => setRestoreToken(e.target.value)}
                          placeholder="Type CONFIRM_RESTORE"
                          className="w-full bg-[#131b2e] border border-[#1f293d] rounded px-3 py-2 text-xs font-mono text-rose-400 focus:outline-none focus:border-rose-500"
                        />
                        {restoreMessage && (
                          <div className={`text-xs font-mono ${restoreMessage.startsWith("Success") ? "text-emerald-400" : "text-rose-400"}`}>
                            {restoreMessage}
                          </div>
                        )}
                        <div className="flex justify-end space-x-2">
                          <button onClick={() => setRestoreModalOpen(false)} className="px-3 py-1.5 rounded text-xs text-slate-400 hover:text-slate-200">
                            Cancel
                          </button>
                          <button onClick={handleRestore} className="px-3 py-1.5 rounded text-xs bg-rose-500 hover:bg-rose-600 text-slate-950 font-bold font-mono">
                            Affirm & Execute Restore
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* 14. USERS, ROLES & AUDIT LOGS */}
              {currentScreen === "audit" && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-bold text-slate-100">Users, Roles & Tamper-Evident Audit Trail</h2>
                      <p className="text-xs text-slate-400">Cryptographically hash-chained append-only log of every administrative and operational action.</p>
                    </div>
                    <span className="px-2.5 py-1 rounded bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-mono flex items-center space-x-1.5">
                      <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                      <span>HASH CHAIN VERIFIED (SHA-256)</span>
                    </span>
                  </div>

                  <div className="bg-[#0e1422] rounded-lg border border-[#1f293d] overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-[#131b2e] text-slate-400 font-mono text-[11px] border-b border-[#1f293d]">
                        <tr>
                          <th className="p-3">ENTRY #</th>
                          <th className="p-3">ACTOR & ROLE</th>
                          <th className="p-3">ACTION</th>
                          <th className="p-3">RESOURCE</th>
                          <th className="p-3">STATUS</th>
                          <th className="p-3">SHA-256 ENTRY HASH</th>
                          <th className="p-3">TIME</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#1f293d] font-mono text-[11px]">
                        {[
                          { id: 1, actor: "admin (Platform Admin)", action: "AUTH_LOGIN", res: "session", status: "SUCCESS", hash: "4f9b2a...7c1", time: "18:29Z" },
                          { id: 2, actor: "admin (Platform Admin)", action: "DEPLOY_INSTALL", res: "v1.0.0-lab", status: "SUCCESS", hash: "8e12d4...a90", time: "18:30Z" },
                          { id: 3, actor: "analyst (Incident Responder)", action: "ALERT_UPDATE", res: "ALT-2026-002", status: "SUCCESS", hash: "3a7c88...1f2", time: "19:05Z" },
                          { id: 4, actor: "admin (Platform Admin)", action: "SYNTHETIC_EVENT_INJECT", res: "suricata", status: "SUCCESS", hash: "b2184a...991", time: "19:40Z" },
                        ].map(e => (
                          <tr key={e.id} className="hover:bg-[#131b2e]/60">
                            <td className="p-3 text-slate-400">#{e.id}</td>
                            <td className="p-3 text-slate-200">{e.actor}</td>
                            <td className="p-3 text-emerald-400">{e.action}</td>
                            <td className="p-3 text-slate-300">{e.res}</td>
                            <td className="p-3 text-emerald-400">{e.status}</td>
                            <td className="p-3 text-slate-400">{e.hash}</td>
                            <td className="p-3 text-slate-400">{e.time}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* 15. PLATFORM SETTINGS */}
              {currentScreen === "settings" && (
                <div className="space-y-4">
                  <h2 className="text-xl font-bold text-slate-100">Platform Settings & Security Guardrails</h2>
                  <p className="text-xs text-slate-400">Deployment profile parameters, retention schedules, and mutual TLS configurations.</p>

                  <div className="bg-[#0e1422] p-5 rounded-lg border border-[#1f293d] space-y-4 text-xs">
                    <div>
                      <label className="font-semibold text-slate-200 block mb-1">Security Mode & Secret Storage</label>
                      <p className="text-slate-400 mb-2">Passwords and private keys are decoupled from git and configuration files.</p>
                      <div className="p-2.5 rounded bg-[#131b2e] border border-[#1f293d] font-mono text-emerald-400">
                        Current: Environment Secret Keyring & Vault Provider Active
                      </div>
                    </div>

                    <div>
                      <label className="font-semibold text-slate-200 block mb-1">Deployment Profile</label>
                      <div className="flex space-x-3 mt-1">
                        <label className="flex items-center space-x-2 text-slate-300">
                          <input type="radio" name="profile" defaultChecked />
                          <span>Profile A: Lab (Single-Node Evaluation)</span>
                        </label>
                        <label className="flex items-center space-x-2 text-slate-400">
                          <input type="radio" name="profile" disabled />
                          <span>Profile B: Distributed (Production Multi-Node)</span>
                        </label>
                      </div>
                    </div>

                    <div>
                      <label className="font-semibold text-slate-200 block mb-1">Index Retention & Snapshot Policy</label>
                      <div className="p-2.5 rounded bg-[#131b2e] border border-[#1f293d] font-mono text-slate-300">
                        Hot: 7 days | Warm: 30 days | Cold Snapshot: 90 days (Auto-delete after 180 days)
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
