class ErrorBoundary extends React.Component {

    console.error("OpenSOC UI ErrorBoundary caught error:", error, errorInfo);

    this.setState({ errorInfo });

    if (this.state.hasError) {

      const errHeader = (this.state.error?.name ? this.state.error.name + ": " : "") + (this.state.error?.message || "Unknown rendering exception");

        errHeader,

        "",

        this.state.errorInfo?.componentStack ? "Component Trace:" + this.state.errorInfo.componentStack : "",
