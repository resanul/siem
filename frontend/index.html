                      <button onClick={() => setWarRoomOpen(false)} className="text-slate-400 hover:text-slate-200">
                        <i data-lucide="x" className="w-4 h-4"></i>
                      </button>
                    </div>

                    <div className="p-5 overflow-y-auto space-y-6 text-xs">
                      <div>
                        <div className="flex justify-between items-center mb-1.5 font-mono text-[11px]">
                          <span className="text-slate-300 font-bold">NIST SP 800-61r2 Containment & Eradication Progress</span>
                          <span className="text-emerald-400">50% Completed (5/10)</span>
                        </div>
                        <div className="w-full bg-[#131b2e] h-2 rounded-full overflow-hidden">
                          <div className="bg-emerald-400 h-full rounded-full" style={{ width: '50%' }}></div>
                        </div>
                      </div>

                      <div>
                        <h4 className="font-bold text-slate-200 mb-2 font-mono">Response Action Checklist:</h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                          {warRoomChecklist.map(item => (
                            <div
                              key={item.id}
                              onClick={() => {
                                setWarRoomChecklist(prev => prev.map(c => c.id === item.id ? { ...c, completed: !c.completed } : c));
                              }}
                              className={`p-2.5 rounded border flex items-start space-x-2.5 cursor-pointer transition-all ${item.completed ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-300" : "bg-[#131b2e] border-[#1f293d] text-slate-300 hover:border-slate-500"}`}
                            >
                              <input type="checkbox" checked={item.completed} readOnly className="mt-0.5 accent-emerald-500" />
                              <div className="flex-1">
                                <span className="text-[10px] font-mono text-slate-400 block uppercase">{item.phase}</span>
                                <span className={item.completed ? "line-through text-slate-400" : "font-medium"}>{item.task}</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between items-center mb-2">
                          <h4 className="font-bold text-slate-200 font-mono">Forensic Evidence Locker:</h4>
                          <span className="text-[10px] text-sky-400 font-mono">Chain of Custody Verified</span>
                        </div>
                        <div className="space-y-2">
                          {warRoomEvidence.map(ev => (
                            <div key={ev.id} className="p-2.5 rounded bg-[#131b2e] border border-[#1f293d] font-mono flex items-center justify-between">
                              <div>
                                <span className="text-sky-400 font-bold">{ev.type}: </span>
                                <span className="text-slate-200">{ev.value}</span>
                                <div className="text-[11px] text-slate-400 mt-0.5">{ev.desc} (Source: {ev.host})</div>
                              </div>
                              <span className="px-2 py-0.5 rounded text-[10px] bg-[#1e293b] text-slate-300">{ev.id}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div>
                        <h4 className="font-bold text-slate-200 mb-2 font-mono">Real-Time Incident Timeline:</h4>
                        <div className="p-3 rounded bg-[#080c14] border border-[#1f293d] space-y-2 max-h-40 overflow-y-auto font-mono text-[11px]">
                          {warRoomTimeline.map(tl => (
                            <div key={tl.id} className="flex items-start space-x-2">
                              <span className="text-slate-400">{tl.time}</span>
                              <span className="text-emerald-400 font-bold">[{tl.author}]:</span>
                              <span className={tl.type === "CONTAINMENT" ? "text-amber-400 font-semibold" : "text-slate-300"}>{tl.msg}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    <div className="p-4 border-t border-[#1f293d] bg-[#131b2e] flex justify-end">
                      <button onClick={() => setWarRoomOpen(false)} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-xs font-bold text-slate-200">
                        Close War Room
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* PROCESS TREE MODAL */}
              {processTreeModalOpen && (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="bg-[#0e1422] border border-[#1f293d] rounded-xl max-w-4xl w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
                    <div className="p-4 border-b border-[#1f293d] flex items-center justify-between bg-[#131b2e]">
                      <div className="flex items-center space-x-3">
                        <i data-lucide="git-branch" className="w-4 h-4 text-emerald-400"></i>
                        <h3 className="font-bold text-slate-100 text-sm font-mono">FORENSIC PROCESS TREE LINEAGE</h3>
                        <span className="px-2 py-0.5 text-[10px] font-bold rounded bg-amber-500/20 text-amber-400">PARENT-CHILD EXECUTION</span>
                      </div>
                      <button onClick={() => setProcessTreeModalOpen(false)} className="text-slate-400 hover:text-slate-200">
                        <i data-lucide="x" className="w-4 h-4"></i>
                      </button>
                    </div>

                    <div className="p-5 overflow-y-auto space-y-4 font-mono text-xs">
                      <div className="p-3 rounded bg-blue-500/10 border border-blue-500/20 text-blue-300 text-[11px]">
                        Trace shows attack weaponization: Word macro dropping command interpreter, which executed an obfuscated PowerShell cradle and spawned vssadmin to inhibit recovery.
                      </div>

                      <div className="space-y-4 pl-2">
                        <div className="p-3 rounded bg-[#131b2e] border border-[#1f293d]">
                          <div className="flex items-center justify-between mb-1">
                            <span className="text-slate-100 font-bold">[PID 1044] WINWORD.EXE (Root Process)</span>
                            <span className="text-[10px] text-slate-400">User: CORP\\jdoe</span>
                          </div>
                          <div className="text-[11px] text-slate-400 truncate">C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE "Invoice_Q3.docm"</div>
                        </div>

                        <div className="ml-6 border-l-2 border-emerald-500/40 pl-4 space-y-4">
                          <div className="p-3 rounded bg-[#131b2e] border border-[#1f293d]">
                            <div className="flex items-center justify-between mb-1">
                              <span className="text-amber-400 font-bold">[PID 4892] cmd.exe (Macro Spawn)</span>
                              <span className="text-[10px] text-amber-400">MITRE T1059.003</span>
                            </div>
                            <div className="text-[11px] text-slate-400 truncate">cmd.exe /c powershell.exe -NoP -NonI -W Hidden -Enc SUVYIChOZXctT2JqZWN0...</div>
                          </div>

                          <div className="ml-6 border-l-2 border-amber-500/40 pl-4 space-y-4">
                            <div className="p-3 rounded bg-[#131b2e] border border-red-500/30">
                              <div className="flex items-center justify-between mb-1">
                                <span className="text-red-400 font-bold">[PID 7812] powershell.exe (Download Cradle)</span>
                                <span className="text-[10px] text-red-400">MITRE T1059.001</span>
                              </div>
                              <div className="text-[11px] text-slate-300 truncate">powershell.exe -NoP -NonI -W Hidden -Enc SUVYIChOZXctT2JqZWN0...</div>
                              <div className="text-[10px] text-emerald-400 mt-1 font-mono">Outbound Socket: 198.51.100.84:1389 (LDAP)</div>
                            </div>

                            <div className="ml-6 border-l-2 border-red-500/40 pl-4">
                              <div className="p-3 rounded bg-[#131b2e] border border-red-500/50">
                                <div className="flex items-center justify-between mb-1">
                                  <span className="text-red-400 font-bold">[PID 9104] vssadmin.exe (Shadow Copy Deletion)</span>
                                  <span className="text-[10px] text-red-400 font-bold">MITRE T1490 (CRITICAL)</span>
                                </div>
                                <div className="text-[11px] text-slate-300 truncate">vssadmin.exe delete shadows /all /quiet</div>
                                <div className="text-[10px] text-amber-400 mt-1 font-mono">Security Alert Triggered: WAZUH-RULE-92011</div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="p-4 border-t border-[#1f293d] bg-[#131b2e] flex justify-end">
                      <button onClick={() => setProcessTreeModalOpen(false)} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-xs font-bold text-slate-200">
                        Close Lineage View
                      </button>
                    </div>
                  </div>
                </div>
              )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
