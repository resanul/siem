manifest_version: "1.0.0"
release_id: "v1.0.0-lab"
channel: "stable"
profile: "lab"
created_at: "2026-10-14T20:00:00Z"
provenance:
  author: "OpenSOC Forge Core Team"
  git_commit: "a1b2c3d4e5f67890"
  signature: "sha256:7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d9069"

supported_platforms:
  - os_family: "ubuntu"
    os_version: "22.04"
    architectures: ["x86_64", "aarch64"]
  - os_family: "ubuntu"
    os_version: "20.04"
    architectures: ["x86_64"]
  - os_family: "debian"
    os_version: "12"
    architectures: ["x86_64"]

components:
  elasticsearch:
    version: "7.17.13"
    type: "native_package"
    package_name: "elasticsearch"
    package_repo: "https://artifacts.elastic.co/packages/7.x/apt"
    digest_or_checksum: "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
    required_ports:
      - port: 9200
        protocol: "tcp"
        purpose: "REST API & Ingestion"
      - port: 9300
        protocol: "tcp"
        purpose: "Cluster Transport"
    required_paths:
      config_dir: "/etc/elasticsearch"
      data_dir: "/var/lib/elasticsearch"
      log_dir: "/var/log/elasticsearch"
    min_system_specs:
      min_ram_mb: 4096
      min_disk_gb: 20
      min_cores: 2
    health_check:
      type: "systemd_and_http"
      endpoint: "http://127.0.0.1:9200/_cluster/health"
      expected_status: 200
      timeout_seconds: 15

  kibana:
    version: "7.17.13"
    type: "native_package"
    package_name: "kibana"
    package_repo: "https://artifacts.elastic.co/packages/7.x/apt"
    digest_or_checksum: "sha256:b5a2c3...kibana"
    required_ports:
      - port: 5601
        protocol: "tcp"
        purpose: "Web Console"
    required_paths:
      config_dir: "/etc/kibana"
      data_dir: "/var/lib/kibana"
      log_dir: "/var/log/kibana"
    min_system_specs:
      min_ram_mb: 1024
      min_disk_gb: 5
      min_cores: 1
    health_check:
      type: "http"
      endpoint: "http://127.0.0.1:5601/api/status"
      expected_status: 200
      timeout_seconds: 20

  filebeat:
    version: "7.17.13"
    type: "native_package"
    package_name: "filebeat"
    package_repo: "https://artifacts.elastic.co/packages/7.x/apt"
    required_ports: []
    required_paths:
      config_dir: "/etc/filebeat"
      data_dir: "/var/lib/filebeat"
      log_dir: "/var/log/filebeat"
    min_system_specs:
      min_ram_mb: 512
      min_disk_gb: 5
      min_cores: 1
    health_check:
      type: "process"
      timeout_seconds: 10

  wazuh_manager:
    version: "4.5.4"
    type: "native_package"
    package_name: "wazuh-manager"
    package_repo: "https://packages.wazuh.com/4.x/apt"
    required_ports:
      - port: 1514
        protocol: "tcp"
        purpose: "Agent Telemetry & Communication"
      - port: 1515
        protocol: "tcp"
        purpose: "Agent Enrollment Service"
      - port: 55000
        protocol: "tcp"
        purpose: "Wazuh REST API"
    required_paths:
      config_dir: "/var/ossec/etc"
      data_dir: "/var/ossec/data"
      log_dir: "/var/ossec/logs"
    min_system_specs:
      min_ram_mb: 2048
      min_disk_gb: 15
      min_cores: 2
    health_check:
      type: "systemd_and_http"
      endpoint: "https://127.0.0.1:55000/manager/status"
      expected_status: 200
      timeout_seconds: 15

  wazuh_agent:
    version: "4.5.4"
    type: "native_package"
    package_name: "wazuh-agent"
    package_repo: "https://packages.wazuh.com/4.x/apt"
    required_ports: []
    required_paths:
      config_dir: "/var/ossec/etc"
      data_dir: "/var/ossec/var"
      log_dir: "/var/ossec/logs"
    min_system_specs:
      min_ram_mb: 256
      min_disk_gb: 2
      min_cores: 1
    health_check:
      type: "process"
      timeout_seconds: 10

  suricata:
    version: "7.0.5"
    type: "native_package"
    package_name: "suricata"
    package_repo: "ppa:oisf/suricata-stable"
    required_ports: []
    required_paths:
      config_dir: "/etc/suricata"
      data_dir: "/var/lib/suricata"
      log_dir: "/var/log/suricata"
    min_system_specs:
      min_ram_mb: 1024
      min_disk_gb: 10
      min_cores: 2
    health_check:
      type: "process"
      timeout_seconds: 10

compatibility_constraints:
  - rule_id: "RULE-ELK-LOCK"
    source_component: "elasticsearch"
    target_component: "kibana"
    constraint: "elasticsearch == kibana"
    description: "Elasticsearch and Kibana must match identical semantic version"

  - rule_id: "RULE-WAZUH-ELK"
    source_component: "wazuh_manager"
    target_component: "elasticsearch"
    constraint: "elasticsearch == 7.17.13 if wazuh_manager == 4.5.4"
    description: "Wazuh 4.5.x requires Elasticsearch 7.17.13"

  - rule_id: "RULE-AGENT-MANAGER"
    source_component: "wazuh_agent"
    target_component: "wazuh_manager"
    constraint: "wazuh_agent <= wazuh_manager"
    description: "Wazuh Agent version cannot exceed Manager version"

supported_upgrade_paths:
  - from_release: "v0.9.0-alpha"
    migration_required: true
    breaking_changes:
      - "Schema migration for EVE JSON v2 field names"
      - "Certificate authority renewal for mutual TLS"
    pre_upgrade_steps:
      - "Export snapshot of existing Elasticsearch indexes"
      - "Back up /etc/wazuh and /etc/suricata configuration directory"

backup_requirements:
  snapshot_required: true
  config_paths:
    - "/etc/elasticsearch"
    - "/etc/kibana"
    - "/etc/filebeat"
    - "/var/ossec/etc"
    - "/etc/suricata"
  metadata_database: true

known_limitations:
  - "Single-node profile does not provide multi-node Elasticsearch high availability"
  - "Default interface packet capture captures host traffic only; SPAN/mirroring required for external segments"
