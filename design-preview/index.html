const nav=document.getElementById("nav");groups.forEach(([g,items])=>{nav.insertAdjacentHTML("beforeend",'<div class="navlabel">'+g+'</div>'+items.map(x=>{let [id,ic,n]=x.split("|");return '<button data-id="'+id+'" onclick="go(\''+id+'\')"><em>'+ic+'</em>'+n+(id==="alerts"||id==="cases"?'<small>'+(id==="alerts"?"72":"6")+'</small>':"")+'</button>'}).join(""))});
function badge(v){let c=String(v).toLowerCase();if(c.includes("critical"))c="critical";else if(c.includes("high"))c="high";else if(c.includes("medium"))c="medium";else if(["healthy","online","connected","passed","valid","ready","completed","enabled","approved"].some(s=>c.includes(s)))c="healthy";else if(["warning","running","pending","gap","review"].some(s=>c.includes(s)))c="warning";return '<span class="badge '+c+'">'+v+'</span>'}
function kpi(l,v,s){return '<div class="card kpi"><label>'+l+'</label><strong>'+v+'</strong><small>'+s+'</small></div>'}
function card(t,b,cls="pad"){return '<section class="card '+cls+'"><div class="secthead"><h3>'+t+'</h3></div>'+b+'</section>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'}

function head(){let m=meta[current];return '<div class="head"><div><div class="eyebrow">OPEN SOC FORGE / '+current.replaceAll("_"," ").toUpperCase()+'</div><h1>'+m[0]+'</h1><p>'+m[1]+' · Synthetic demonstration data</p></div><div class="actions">'+btn("↻ Refresh","refreshPage()")+btn("Export view","toast(\'Demo export prepared\')")+'</div></div>'}
function openDrawer(t,b){document.getElementById("drawerTitle").textContent=t;document.getElementById("drawerBody").innerHTML=b;document.getElementById("drawerback").classList.add("show")}
function closeDrawer(){document.getElementById("drawerback").classList.remove("show")}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}
function navToggle(v){document.getElementById("side").classList.toggle("open",v);document.getElementById("mobileback").classList.toggle("show",v)}
function go(id){current=id;render();navToggle(false);window.scrollTo(0,0)}
function refreshPage(){toast("Demo dataset refreshed · "+new Date().toLocaleTimeString())}
function dataTable(id,headers,rows){return '<div class="toolbar"><input class="field" placeholder="Filter rows…" oninput="filterRows(\''+id+'\',this.value)"><select onchange="filterRows(\''+id+'\',this.value)"><option value="">All statuses</option><option>Critical</option><option>High</option><option>Healthy</option></select></div><div id="'+id+'">'+table(headers,rows)+'</div>'}
function filterRows(id,q){let root=document.getElementById(id);if(!root)return;root.querySelectorAll("tbody tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?"":"none")}
function alertRows(){let arr=A.filter(a=>(alertFilter==="ALL"||a[1]===alertFilter));let start=(alertPage-1)*5;return arr.slice(start,start+5).map(a=>['<span class="mono">'+a[0]+'</span>',badge(a[1]),a[2],a[3],a[5],a[6],btn("Inspect","alertDetail(\'"+a[0]+"\')")])}

function pageReleases(){return card("Release manifest",'<div class="toolbar"><select><option>Stable channel</option><option>Candidate</option><option>Archived</option></select>'+btn("Validate manifest","toast(\'Manifest validation passed\')","primary")+'</div>'+table(["COMPONENT","CURRENT","TARGET","COMPATIBILITY","READINESS","DETAIL"],COMP.slice(0,6).map((c,i)=>[c[0],c[1],c[1],badge("Compatible"),(95-i*3)+"%",btn("Inspect","openDrawer(\'Release compatibility\',\'<p>"+c[0]+" compatible with platform release 0.2.0</p>\')")])) )+card("Dependency readiness",'<div class="timeline"><div class="step"><b>Core services · compatible</b><small>API contract checks passed</small></div><div class="step"><b>Storage layer · compatible</b><small>Index mappings verified</small></div><div class="step"><b>Endpoint adapters · review</b><small>One connector not configured</small></div></div>')}
function pageBackup(){return '<div class="grid kpis">'+kpi("Checkpoints","18","Verified backups")+kpi("Latest backup","2h ago","Successful")+kpi("Storage","42.8 GB","30 day retention")+kpi("Integrity","100%","Checksums valid")+'</div>'+card("Recovery checkpoints",table(["CHECKPOINT","CREATED","SIZE","SHA-256","INTEGRITY","ACTION"],[["BKP-2026-118","Today 08:00","2.4 GB",'<span class="mono">a91d…e82f</span>',badge("Verified"),btn("Restore","restoreConfirm(\'BKP-2026-118\')")],["BKP-2026-117","Yesterday 08:00","2.3 GB",'<span class="mono">b82e…a17c</span>',badge("Verified"),btn("Restore","restoreConfirm(\'BKP-2026-117\')")]])) +card("Restore readiness",'<p class="muted">Restore actions are simulated. No backup is changed or applied to a real system.</p><div class="list"><div class="listrow"><b>Checksum validation</b><div class="right">'+badge("Passed")+'</div></div><div class="listrow"><b>Manifest verification</b><div class="right">'+badge("Passed")+'</div></div><div class="listrow"><b>Target confirmation</b><div class="right">'+badge("Required")+'</div></div></div>')}
function restoreConfirm(id){openDrawer("Restore confirmation",'<div class="card pad"><h4>'+id+'</h4><p class="muted">Confirm a simulated restore workflow for this checkpoint. No production restore will occur.</p><label><input type="checkbox" id="restoreAck"> I understand this is a demo restore</label><p><select id="restoreTarget"><option>Isolated recovery lab</option><option>Staging environment</option></select></p>'+btn("Confirm simulated restore","if(document.getElementById(\'restoreAck\').checked){closeDrawer();toast(\'Restore simulation completed\')}else toast(\'Confirmation required\')","danger")+'</div>')}
function pageAudit(){let rows=[["10:42:18","soc.analyst","ALERT_ACKNOWLEDGE","AL-20481","10.20.4.21","Valid"],["10:31:04","platform.admin","PLAYBOOK_EXECUTE","EX-2204","10.20.1.8","Valid"],["09:52:44","detector","RULE_UPDATE","SIG-1001","10.20.4.18","Valid"],["09:15:22","recovery.ops","BACKUP_CREATE","BKP-118","10.20.1.9","Valid"]];return '<div class="grid kpis">'+kpi("Audit events","8,421","Last 30 days")+kpi("Chain integrity","VALID","Hash verified")+kpi("Admin actions","142","Privileged events")+kpi("Failed actions","8","Review required")+'</div>'+card("Immutable audit trail",'<div class="toolbar"><input class="field" placeholder="Filter actor, action, resource…" oninput="filterRows(\'audittable\',this.value)"><select><option>All actions</option><option>Privileged</option><option>Failed</option></select></div><div id="audittable">'+table(["TIMESTAMP","ACTOR","ACTION","RESOURCE","SOURCE IP","INTEGRITY","DETAIL"],rows.map(r=>[r[0],r[1],r[2],r[3],r[4],badge(r[5]),btn("Expand","openDrawer(\'Audit event\',\'<p>Actor: "+r[1]+"</p><p>Action: "+r[2]+"</p><p>Resource: "+r[3]+"</p><p>SHA-256 chain: 9af1…c201</p>\')")]))+'</div>')}
function pageSettings(){return '<div class="grid g2"><div>'+card("General configuration",'<form id="settingsForm" onsubmit="event.preventDefault();settingsSave()"><label>Platform name</label><input class="field" name="platform" value="OpenSOC Forge" required><label>Deployment profile</label><select class="field"><option>RHEL 9 / Podman</option><option>Docker</option><option>Kubernetes</option></select><label>Default time range</label><select class="field"><option>Last 24 hours</option><option>Last 7 days</option><option>Last 30 days</option></select><label>Session timeout (minutes)</label><input class="field" type="number" min="5" max="240" value="30" required><label>Retention days</label><input class="field" type="number" min="1" max="365" value="30" required><div class="toolbar" style="margin-top:14px"><button class="btn primary" type="submit">Validate & save</button><button class="btn" type="reset">Reset</button></div></form><div id="settingsmsg"></div>')+'</div>'+card("Security controls",'<div class="list">'+["TLS enforcement","Audit logging","MFA for administrators","Secret vault integration","Signed release manifests"].map((x,i)=>'<div class="listrow"><b>'+x+'</b><div class="right"><input type="checkbox" '+(i!==3?"checked":"")+'></div></div>').join("")+'</div><p class="muted">Settings are stored only in this page session for demonstration.</p>')+'</div>'}
function settingsSave(){let f=document.getElementById("settingsForm");if(!f.reportValidity())return;document.getElementById("settingsmsg").innerHTML='<p class="green">✓ Configuration validated and saved in demo session.</p>';toast("Demo settings saved")}
function globalFind(q){let a=A.find(x=>x.join(" ").toLowerCase().includes(q.toLowerCase()));if(a){go("alerts");setTimeout(()=>alertDetail(a[0]),20)}else{go("search");toast("Search workspace opened for: "+q)}}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.id===current));let f={overview:pageOverview,alerts:pageAlerts,search:pageSearch,hosts:pageHosts,network:pageNetwork,cases:pageCases,adversary_sim:simPage,bas_testing:pageBAS,purple_team:pagePurple,soar_playbooks:pageSOAR,threat_hunting:pageHunt,mitre_heatmap:pageMitre,threat_intel:pageIntel,sigma_studio:pageSigma,rules:pageRules,reports:pageReports,inventory:pageInventory,jobs:pageJobs,health:pageHealth,releases:pageReleases,backup:pageBackup,audit:pageAudit,settings:pageSettings};document.getElementById("content").innerHTML=head()+f[current]();document.title=meta[current][0]+" · OpenSOC Forge"}
render();
</script></body></html>
