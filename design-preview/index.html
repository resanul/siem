function overview(){return '<div class="grid kpis">'+kpi("Events / sec","86.4","↑ 12.8% vs prior", "#38bdf8")+kpi("Active alerts","1,284","72 critical", "#f16c78")+kpi("Open cases","36","6 priority cases","#f4b85a")+kpi("Monitored assets","1,248","98.4% reporting","#35d39a")+kpi("Pipeline latency","1.8s","Within target","#648cff")+kpi("MITRE coverage","68.2%","↑ 4.6% this month","#a78bfa")+'</div><div class="grid two">'+card("Event ingestion · Last 24 hours",chart(),'<span class="live-dot"></span>LIVE DEMO')+card("Alert severity distribution",'<div class="donutwrap"><div class="donut"></div><div class="donutlegend"><span style="--c:#f16c78">Critical · 72</span><span style="--c:#f4b85a">High · 242</span><span style="--c:#648cff">Medium · 518</span><span style="--c:#35d39a">Low · 452</span></div></div>')+'</div><div class="grid two" style="margin-top:14px">'+card("Event volume by hour",bars(),"LAST 12 HOURS")+card("Security infrastructure",'<div class="list">'+components.slice(0,5).map(x=>'<div class="listrow"><span class="navicon">◈</span><div><strong>'+x[0]+'</strong><small>'+x[1]+' · '+x[3]+'</small></div><div class="right">'+badge(x[2])+'</div></div>').join("")+'</div>')+'</div><div style="margin-top:14px">'+card("Latest security alerts",table(["ID","SEVERITY","DETECTION","HOST","SOURCE","TIME"],alerts.slice(0,5).map(a=>['<span class="mono">'+a[0]+'</span>',badge(a[1]),a[2],a[3],a[4],a[5]])),"VIEW ALL")+'</div>'}
function alertsPage(){return '<div class="grid kpis">'+kpi("Total alerts","1,284","Last 24 hours","#38bdf8")+kpi("Critical","72","Needs triage","#f16c78")+kpi("High","242","Requires review","#f4b85a")+kpi("Acknowledged","816","63.5% of total","#35d39a")+'</div>'+card("Detection queue",'<div class="tabletools"><input class="field" placeholder="Search alerts…" oninput="filterTable(this.value)"><select class="select" onchange="filterSeverity(this.value)"><option value="">All severities</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select><select class="select"><option>All sources</option><option>Wazuh</option><option>Suricata</option><option>Syslog</option></select><button class="btn" onclick="toast(\'Filters cleared\')">Reset</button></div><div id="tableTarget">'+alertTable(alerts)+'</div>')}
function alertTable(rows){return table(["ALERT ID","SEVERITY","DETECTION","HOST","SOURCE","TIME","MITRE"],rows.map(a=>['<span class="mono">'+a[0]+'</span>',badge(a[1]),a[2],a[3],a[4],a[5],'<span class="mono">'+a[6]+'</span>']))}
function genericTable(title,headers,rows){return card(title,'<div class="tabletools"><input class="field" placeholder="Search records…" oninput="filterTable(this.value)"><select class="select"><option>All statuses</option><option>Active</option><option>Warning</option><option>Critical</option></select></div><div id="tableTarget">'+table(headers,rows)+'</div>')}
function screenBody(){switch(current){
case "overview":return overview();
case "alerts":return alertsPage();
case "search":return card("Query workbench",'<div class="tabletools"><select class="select"><option>All data sources</option><option>Wazuh</option><option>Suricata</option><option>Syslog</option></select><select class="select"><option>Last 24 hours</option><option>Last 7 days</option></select><button class="btn primary" onclick="toast(\'Query executed · 16 demo events\')">▶ Run query</button></div><textarea class="editor" style="min-height:88px">event.category: authentication AND event.outcome: failure\n| stats count() by source.ip, user.name</textarea><div class="panelhead" style="margin-top:16px"><h3>Search results</h3><small>16 events · 42ms · DEMO</small></div>'+table(["EVENT ID","CATEGORY","HOST","SOURCE IP","OUTCOME","TIME"],events.map(e=>['<span class="mono">'+e[0]+'</span>',e[1],e[2],e[3],badge(e[4]),e[5]])));
case "hosts":return '<div class="grid kpis">'+kpi("Total endpoints","1,248","Managed assets","#38bdf8")+kpi("Active agents","1,229","98.4% reporting","#35d39a")+kpi("Disconnected","19","Requires attention","#f4b85a")+kpi("Unhealthy","7","Investigate","#f16c78")+'</div>'+genericTable("Endpoint fleet",["HOST","OPERATING SYSTEM","IP ADDRESS","AGENT STATUS","LAST SEEN","HEALTH"],hosts.map(h=>[h[0],h[1],'<span class="mono">'+h[2]+'</span>',badge(h[3]),h[4],badge(h[5])])); 
case "network":return '<div class="grid two">'+card("Protocol distribution",'<div class="donutwrap"><div class="donut" style="background:conic-gradient(#38bdf8 0 42%,#a78bfa 42% 68%,#35d39a 68% 86%,#f4b85a 86%)"></div><div class="donutlegend"><span style="--c:#38bdf8">TCP · 42%</span><span style="--c:#a78bfa">TLS · 26%</span><span style="--c:#35d39a">DNS · 18%</span><span style="--c:#f4b85a">Other · 14%</span></div></div>')+card("Network events · 24h",chart())+'</div><div class="grid kpis" style="margin-top:14px">'+kpi("Total flows","2.8M","↑ 8.2%","#38bdf8")+kpi("DNS queries","428K","Normal","#35d39a")+kpi("TLS sessions","892K","JA4 enabled","#648cff")+kpi("Sensor drops","0.08%","Within threshold","#f4b85a")+'</div>'+genericTable("Recent network telemetry",["TIME","SOURCE IP","DESTINATION","PROTOCOL","EVENT","SEVERITY"],events.slice(0,8).map(e=>[e[5],e[3],e[2],"TCP / TLS",e[1],badge("MEDIUM")]));
case "cases":return '<div class="grid kpis">'+kpi("Open cases","36","6 priority","#38bdf8")+kpi("Investigating","12","Active response","#f4b85a")+kpi("Contained","8","Awaiting closure","#35d39a")+kpi("MTTR","42m","↓ 11%","#648cff")+'</div>'+genericTable("Incident queue",["CASE","TITLE","PRIORITY","STATUS","OWNER","UPDATED"],cases.map(c=>['<span class="mono">'+c[0]+'</span>',c[1],badge(c[2]),badge(c[3]),c[4],c[5]]))+'<div style="margin-top:14px">'+card("Investigation timeline",'<div class="timeline"><div class="event"><strong>Credential anomaly detected</strong><small>10:42 · Alert AL-20481 associated with CASE-0092</small></div><div class="event"><strong>Analyst assigned · SOC Tier 2</strong><small>10:49 · Initial triage started</small></div><div class="event"><strong>Evidence collected from AD-DC-01</strong><small>10:55 · Authentication records attached</small></div></div>')+'</div>';
case "adversary_sim":return '<div class="grid tilegrid">'+tile("PowerShell execution","T1059.001","Simulate suspicious PowerShell activity","Run simulation")+tile("Defense evasion","T1562.001","Validate tamper protection detections","Review test")+tile("Credential access","T1003.001","Validate credential dumping detection","Run simulation")+'</div>'+card("Recent simulation runs",table(["SCENARIO","TECHNIQUE","STATUS","TARGET","STARTED"],[["PowerShell encoded command","T1059.001",badge("Completed"),"LAB-WIN-01","Today 10:20"],["Credential dumping","T1003.001",badge("Blocked"),"LAB-WIN-02","Today 09:40"]]));
case "bas_testing":return '<div class="grid kpis">'+kpi("Test scenarios","48","Across 8 tactics","#38bdf8")+kpi("Passed","36","75% success","#35d39a")+kpi("Failed","8","Detection gaps","#f16c78")+kpi("Not tested","4","Review scope","#f4b85a")+'</div>'+genericTable("Validation scenarios",["TEST ID","TECHNIQUE","DESCRIPTION","LAST RESULT","COVERAGE"],[["BAS-001","T1059.001","PowerShell execution",badge("Passed"),"Strong"],["BAS-002","T1003.001","Credential dumping",badge("Failed"),"Gap"],["BAS-003","T1071.001","Web protocol C2",badge("Passed"),"Strong"],["BAS-004","T1041","Data exfiltration",badge("Not tested"),"Unknown"]]);
case "purple_team":return card("Exercise coverage matrix",'<div class="heat">'+["T1059.001","T1003.001","T1071.001","T1041","T1021.002","T1110","T1562.001","T1053.005","T1105","T1190","T1055","T1486"].map((x,i)=>'<div class="heatcell '+(i%4===1?"med":i%5===0?"none":"")+'">'+x+'<br><small>'+(i%4===1?"GAP":i%5===0?"NOT TESTED":"VALIDATED")+'</small></div>').join("")+'</div><div class="legend"><span>■ Validated</span><span style="color:#f4b85a">■ Coverage gap</span><span style="color:#8da2bb">■ Not tested</span></div>')+'<div style="margin-top:14px">'+card("Current exercise",'<div class="detail"><h4>Quarterly Detection Validation · Q4</h4><p>12 techniques selected · 9 validated · 2 gaps · 1 not tested</p><div class="statusline"><span style="width:75%"></span></div></div>')+'</div>';
case "soar_playbooks":return '<div class="grid tilegrid">'+tile("Endpoint isolation","CONTAINMENT","Isolate a compromised endpoint using approved response integration","View playbook")+tile("Collect host evidence","FORENSICS","Collect supported diagnostic and investigation evidence","View playbook")+tile("Block malicious IOC","THREAT INTEL","Submit an indicator to supported enforcement integration","View playbook")+'</div>'+genericTable("Playbook execution history",["EXECUTION","PLAYBOOK","TRIGGER","STATUS","STARTED"],[["EX-2204","Endpoint isolation","Manual approval",badge("Completed"),"10:31"],["EX-2203","IOC enrichment","Alert trigger",badge("Running"),"10:25"],["EX-2202","Host evidence collection","Case action",badge("Failed"),"09:52"]]);
case "threat_hunting":return card("Hunt workspace",'<div class="tabletools"><select class="select"><option>Last 24 hours</option><option>Last 7 days</option></select><button class="btn primary" onclick="toast(\'Hunt query completed · demo dataset\')">▶ Execute hunt</button></div><textarea class="editor" style="min-height:90px">source.ip: 185.220.101.14 OR destination.ip: 185.220.101.14\n| group by host.name, event.category</textarea><div class="grid three" style="margin-top:14px">'+kpi("Matched events","124","Across 6 hosts","#38bdf8")+kpi("Entities","18","Hosts, IPs, users","#648cff")+kpi("Risk score","82 / 100","Elevated","#f4b85a")+'</div>')+'<div style="margin-top:14px">'+card("Investigation pivots",table(["ENTITY","TYPE","OBSERVATIONS","RISK"],[["185.220.101.14","IP address","18 connections",badge("CRITICAL")],["FIN-WS-044","Host","12 events",badge("HIGH")],["svc-backup","Account","4 logons",badge("MEDIUM")]]))+'</div>';
case "mitre_heatmap":return card("ATT&CK technique coverage",'<div class="tabletools"><select class="select"><option>All tactics</option><option>Initial Access</option><option>Execution</option><option>Credential Access</option></select><select class="select"><option>All coverage</option><option>Validated</option><option>Gap</option></select></div><div class="heat">'+Array.from({length:30},(_,i)=>'<div class="heatcell '+(i%7===0?"none":i%5===0?"med":"")+'">T'+(1000+i)+'<br><small>'+(i%7===0?"NO DATA":i%5===0?"GAP":"DETECTED")+'</small></div>').join("")+'</div><div class="legend"><span>■ Validated detection</span><span style="color:#f4b85a">■ Gap</span><span style="color:#8da2bb">■ No data</span></div>');
case "threat_intel":return '<div class="grid kpis">'+kpi("Total indicators","17,524","Local IOC database","#38bdf8")+kpi("Critical","482","High confidence","#f16c78")+kpi("Active feeds","8 / 8","Provider status","#35d39a")+kpi("Last sync","12 min","Demo timestamp","#648cff")+'</div>'+genericTable("IOC repository",["INDICATOR","TYPE","SEVERITY","PROVIDER","CONTEXT"],iocs.map(i=>['<span class="mono">'+i[0]+'</span>',i[1],badge(i[2]),i[3],i[4]]))+'<div style="margin-top:14px">'+card("Threat feed providers",'<div class="grid three">'+["Cisco Talos","ThreatFox","URLhaus","Feodo Tracker","MalwareBazaar","CISA KEV"].map(n=>'<div class="detail"><strong>'+n+'</strong><div style="margin-top:7px">'+badge("Connected")+'</div></div>').join("")+'</div>')+'</div>';
case "sigma_studio":return '<div class="grid two">'+card("Detection rule editor",'<textarea class="editor">title: Suspicious PowerShell Execution\nid: 1b3a-92d1\nstatus: experimental\nlogsource:\n  product: windows\n  category: process_creation\ndetection:\n  selection:\n    Image|endswith: \\\\powershell.exe\n    CommandLine|contains: \'-enc\'\n  condition: selection\nlevel: high</textarea><div class="tabletools" style="margin-top:10px"><button class="btn primary" onclick="toast(\'Sigma syntax valid · demo\')">✓ Validate</button><button class="btn" onclick="toast(\'Fixture matched · demo\')">Run fixture test</button></div>')+card("Validation output",'<div class="detail"><h4>Rule validation</h4>'+badge("Valid syntax")+'<p style="margin-top:10px">Schema validation passed. Rule metadata and detection condition are structurally valid in this demo.</p></div><div class="detail" style="margin-top:10px"><h4>Target output</h4><p>Elastic query · Wazuh XML · Suricata signature</p></div>')+'</div>';
case "rules":return genericTable("Detection rules",["RULE ID","NAME","TYPE","SEVERITY","STATUS","UPDATED"],[["SIG-1001","Suspicious PowerShell","Sigma",badge("HIGH"),badge("Enabled"),"Today"],["WAZ-2031","SSH brute force","Wazuh",badge("CRITICAL"),badge("Enabled"),"Yesterday"],["SUR-8812","Known C2 beacon","Suricata",badge("HIGH"),badge("Enabled"),"Yesterday"],["COR-001","Multi-source brute force","Correlation",badge("HIGH"),badge("Enabled"),"Today"]])+'<div style="margin-top:14px">'+card("Connected integrations",'<div class="grid three">'+["Wazuh","Suricata","Syslog","Elasticsearch","CrowdStrike","Sophos Central"].map(n=>'<div class="detail"><strong>'+n+'</strong><p style="margin:5px 0">'+badge(n==="Sophos Central"?"Not configured":"Connected")+'</p></div>').join("")+'</div>')+'</div>';
case "reports":return '<div class="grid kpis">'+kpi("MTTD","4m 12s","↓ 18%","#35d39a")+kpi("MTTR","42m","↓ 11%","#35d39a")+kpi("Incidents","36","Last 30 days","#38bdf8")+kpi("CIS posture","92.4%","↑ 2.1%","#648cff")+'</div><div class="grid two">'+card("Security event trend",chart())+card("Compliance posture",'<div class="donutwrap"><div class="donut" style="background:conic-gradient(#35d39a 0 92%,#f4b85a 92%)"></div><div class="donutlegend"><span style="--c:#35d39a">Compliant · 92.4%</span><span style="--c:#f4b85a">Needs review · 7.6%</span></div></div>')+'</div><div style="margin-top:14px">'+card("Available reports",table(["REPORT","PERIOD","GENERATED","STATUS","ACTION"],[["Executive SOC briefing","Last 30 days","Today 08:00",badge("Ready"),'<button class="btn" onclick="toast(\'Demo report preview\')">Preview</button>'],["CIS Benchmark posture","Current","Yesterday",badge("Ready"),'<button class="btn" onclick="toast(\'Demo report preview\')">Preview</button>']]))+'</div>';
case "inventory":return genericTable("Platform components",["COMPONENT","VERSION","STATUS","PORTS","TYPE"],components.map(c=>[c[0],c[1],badge(c[2]),'<span class="mono">'+c[3]+'</span>',"Service / Adapter"]));
case "jobs":return '<div class="grid kpis">'+kpi("Total jobs","142","Last 30 days","#38bdf8")+kpi("Completed","131","92.2% success","#35d39a")+kpi("Running","3","In progress","#f4b85a")+kpi("Failed","8","Needs review","#f16c78")+'</div>'+genericTable("Deployment and orchestration jobs",["JOB ID","TASK","STATUS","PROGRESS","DURATION"],jobs.map(j=>['<span class="mono">'+j[0]+'</span>',j[1],badge(j[2]),'<div style="min-width:90px">'+j[3]+'<div class="statusline"><span style="width:'+j[3]+'"></span></div></div>',j[4]]));
case "health":return '<div class="grid kpis">'+kpi("Platform status","HEALTHY","All critical services","#35d39a")+kpi("CPU usage","34%","Normal","#38bdf8")+kpi("Memory","62%","Normal","#648cff")+kpi("Disk usage","71%","Monitor","#f4b85a")+'</div><div class="grid two">'+card("Service health",'<div class="list">'+components.map(c=>'<div class="listrow"><div><strong>'+c[0]+'</strong><small>'+c[1]+'</small></div><div class="right">'+badge(c[2])+'</div></div>').join("")+'</div>')+card("Pipeline diagnostics",'<div class="list">'+[["Process checks","Passed"],["Authenticated API checks","Passed"],["Synthetic event delivery","Passed"],["Indexing pipeline","Passed"],["Sensor packet drops","Warning"]].map(x=>'<div class="listrow"><strong>'+x[0]+'</strong><div class="right">'+badge(x[1])+'</div></div>').join("")+'</div>')+'</div>';
case "releases":return genericTable("Release compatibility registry",["COMPONENT","CURRENT","TARGET","COMPATIBILITY","READINESS"],components.slice(0,5).map((c,i)=>[c[0],c[1],c[1],badge("Compatible"),(95-i*3)+"%"]));
case "backup":return '<div class="grid kpis">'+kpi("Checkpoints","18","Verified backups","#38bdf8")+kpi("Latest backup","2h ago","Successful","#35d39a")+kpi("Storage used","42.8 GB","Retention 30 days","#648cff")+kpi("Integrity","100%","Checksums valid","#35d39a")+'</div>'+genericTable("Recovery checkpoints",["CHECKPOINT","CREATED","SIZE","SHA-256","STATUS","ACTION"],[["BKP-2026-118","Today 08:00","2.4 GB",'<span class="mono">a91d…e82f</span>',badge("Verified"),'<button class="btn" onclick="confirmAction(\'Restore checkpoint BKP-2026-118?\')">Restore</button>'],["BKP-2026-117","Yesterday 08:00","2.3 GB",'<span class="mono">b82e…a17c</span>',badge("Verified"),'<button class="btn" onclick="confirmAction(\'Restore checkpoint BKP-2026-117?\')">Restore</button>']]);
case "audit":return '<div class="grid kpis">'+kpi("Audit events","8,421","Last 30 days","#38bdf8")+kpi("Chain integrity","VALID","Hash verified","#35d39a")+kpi("Admin actions","142","Privileged events","#f4b85a")+kpi("Failed actions","8","Review required","#f16c78")+'</div>'+genericTable("Immutable audit trail",["TIMESTAMP","ACTOR","ACTION","RESOURCE","SOURCE IP","INTEGRITY"],[["10:42:18","soc.analyst","ALERT_ACKNOWLEDGE","AL-20481","10.20.4.21",badge("Valid")],["10:31:04","platform.admin","PLAYBOOK_EXECUTE","EX-2204","10.20.1.8",badge("Valid")],["09:52:44","detector","RULE_UPDATE","SIG-1001","10.20.4.18",badge("Valid")],["09:15:22","recovery.ops","BACKUP_CREATE","BKP-118","10.20.1.9",badge("Valid")]]));
case "settings":return '<div class="grid two">'+card("General configuration",'<div class="list">'+setting("Platform name","OpenSOC Forge")+setting("Deployment profile","RHEL 9 / Podman")+setting("Default time range","Last 24 hours")+setting("Session timeout","30 minutes")+'</div><button class="btn primary" style="margin-top:14px" onclick="toast(\'Demo settings saved locally\')">Save changes</button>')+card("Security configuration",'<div class="list">'+setting("TLS enforcement","Enabled")+setting("Secret vault","Environment provider")+setting("Audit logging","Enabled")+setting("Index retention","30 days")+'</div><div class="detail" style="margin-top:14px"><h4>Preview-only configuration</h4><p>Changes in this demo are not sent to the production backend.</p></div>')+'</div>';
default:return card("Workspace",'<div class="empty">Select a workspace from the navigation.</div>');
}}
function setting(k,v){return '<div class="listrow"><div><strong>'+k+'</strong></div><div class="right"><span style="color:#b8cbe0;font-size:11px">'+v+'</span></div></div>'}
function tile(title,tag,desc,btn){return '<div class="card tile"><div class="symbol">◈</div><div class="eyebrow">'+tag+'</div><h3>'+title+'</h3><p>'+desc+'</p><button class="btn" onclick="toast(\'Demo action · no live system changes\')">'+btn+' →</button></div>'}
function render(){document.querySelectorAll(".navitem").forEach(b=>b.classList.toggle("active",b.dataset.screen===current));document.getElementById("content").innerHTML=pageHead()+screenBody();document.title=screens[current][0]+" · OpenSOC Forge"}
function go(id){if(!screens[id])return;current=id;page=1;filter="";render();toggleNav(false);window.scrollTo({top:0,behavior:"smooth"})}
function toggleNav(open){document.getElementById("sidebar").classList.toggle("open",open);document.getElementById("mobileback").classList.toggle("show",open)}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function primaryAction(){toast(current==="backup"?"Demo checkpoint prepared": "Demo action only · production data is untouched")}
function closeDrawer(){document.getElementById("overlay").classList.remove("show")}
function openDrawer(title,body){document.getElementById("drawerTitle").textContent=title;document.getElementById("drawerBody").innerHTML=body;document.getElementById("overlay").classList.add("show")}
function confirmAction(msg){openDrawer("Confirm demo action",'<div class="detail"><h4>'+msg+'</h4><p>This is a simulation. No production data or services will be modified.</p></div><div class="actions" style="margin:18px 0 0"><button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn danger" onclick="closeDrawer();toast(\'Demo restore flow completed\')">Confirm demo</button></div>')}
function filterTable(q){let target=document.getElementById("tableTarget");if(!target)return;let rows=target.querySelectorAll("tbody tr");rows.forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?"":"none")}
function filterSeverity(s){let rows=alerts.filter(a=>!s||a[1]===s);document.getElementById("tableTarget").innerHTML=alertTable(rows)}
function searchGlobal(q){let v=q.toLowerCase();let found=alerts.find(a=>a.join(" ").toLowerCase().includes(v));if(found){go("alerts");setTimeout(()=>openDrawer(found[0],'<div class="detail"><h4>'+found[2]+'</h4><p>'+found[3]+' · '+found[4]+' · '+found[5]+'</p><div style="margin-top:10px">'+badge(found[1])+' <span class="mono">'+found[6]+'</span></div></div>'),30)}else{go("search");toast("Opened event search for: "+q)}}
render();
</script></body></html>
