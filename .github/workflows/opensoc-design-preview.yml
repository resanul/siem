name: OpenSOC Forge design preview

on:
  push:
    branches:
      - design-preview/hybrid-soc-ui
    paths:
      - "design-preview/**"
      - ".github/workflows/opensoc-design-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "opensoc-design-preview"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload isolated preview only
        uses: actions/upload-pages-artifact@v3
        with:
          path: "design-preview"
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
