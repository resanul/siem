# OpenSOC Forge Kernel Optimizations
# Requirement R1 & R4: Kernel parameter tuning for Elasticsearch & Telemetry Ingestion

# Elasticsearch requires high virtual memory areas
vm.max_map_count=262144

# Increased file descriptor limits for concurrent socket handling
fs.file-max=65536

# Socket backlog queue limit for high-throughput network capture
net.core.somaxconn=1024
